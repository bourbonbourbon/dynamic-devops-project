name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Analyse the code with pylint
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pylint --fail-under=9 src tests

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  unittests:
    runs-on: ubuntu-latest
    needs: lint
    env:
      PORT: "8080"
      HOST: "0.0.0.0"
      SENSEBOXES: "5eba5fbad46fb8001b799786,5a77184229b729001a150c10,6448d061258367000707ec8b,5e5fc72957703e001b7b1f0a,5eb3d2ea9724e9001ce71aa9,5f70d5b9a98020001bbd2c89"
      S3_ENDPOINT_URL: "http://localhost:9000"
      S3_ACCESS_KEY: "ROOTUSER"
      S3_SECRET_KEY: "unit-test-only"
      S3_BUCKET: "avg-temp"
      S3_OBJECT: "avg-temp"
      S3_REGION: "us-east-1"
      VKURL: "localhost"
      VKPORT: "6379"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run valkey docker
        run: docker run -d -p 6379:6379 --name valkey valkey/valkey:latest

      - name: Run pytest
        run: pytest

      - name: Stop and remove valkey
        if: always()
        run: |
          docker stop valkey
          docker rm valkey

  build:
    runs-on: ubuntu-latest
    needs: unittests
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version number
        run: |
          ver=$(grep -oP '"[\S]*"' src/version.py | cut -d'"' -f2)
          echo "Version=$ver" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/bourbonbourbon/ddp:${{ env.Version }}
          target: prod

  version-check:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version number
        run: |
          ver=$(grep -oP '"[\S]*"' src/version.py | cut -d'"' -f2)
          echo "Version=$ver" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Docker image
        run: |
          docker run -d -p 8080:8080 --name ddp \
            --env-file .env.example \
            ghcr.io/bourbonbourbon/ddp:${{ env.Version }}

      - name: Version check
        run: |
          sleep 3
          expected=$(grep -i version src/version.py | cut -d "=" -f 2 | tr -d ' "')
          actual=$(curl -s http://localhost:8080/version | jq -r ".version")
          echo "Expected: $expected, actual: $actual"
          if [ "$actual" = "$expected" ]; then
            echo "Version Check Successful"
          else
            echo "Version Check Failed"
            docker logs ddp
            exit 1
          fi

      - name: Stop and remove Docker container
        if: always()
        run: |
          docker stop ddp
          docker rm ddp