name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-test.txt

      - name: Analyse the code with pylint
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pylint --fail-under=9 src tests

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  unittests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Create .env file
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-test.txt

      - name: Start Valkey and RustFS with Compose
        run: docker compose --env-file .env up -d --wait valkey rustfs

      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      
      - name: Add coverage report to the job summary
        if: always()
        run: coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs valkey rustfs

      - name: Stop and remove the services
        if: always()
        run: docker compose down -v
  
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Create .env file
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-test.txt

      - name: Start Valkey and RustFS with Compose
        run: docker compose --env-file .env up -d --wait valkey rustfs

      - name: Run integration tests
        run: pytest -m integration -v

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs valkey rustfs

      - name: Stop and remove the services
        if: always()
        run: docker compose down -v

  build:
    runs-on: ubuntu-latest
    needs: [unittests, integration-tests]
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version number
        run: |
          ver=$(grep -oP '"[\S]*"' src/version.py | cut -d'"' -f2)
          echo "Version=$ver" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/bourbonbourbon/ddp:${{ env.Version }}
          target: prod

  version-check:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Create .env file
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Extract version number
        run: |
          ver=$(grep -oP '"[\S]*"' src/version.py | cut -d'"' -f2)
          echo "Version=$ver" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Docker image
        run: |
          docker run --env-file .env -d -p 8080:8080 --name ddp \
            ghcr.io/bourbonbourbon/ddp:${{ env.Version }}

      - name: Version check
        run: |
          sleep 3
          expected=$(grep -i version src/version.py | cut -d "=" -f 2 | tr -d ' "')
          actual=$(curl -s http://localhost:8080/version | jq -r ".version")
          echo "Expected: $expected, actual: $actual"
          if [ "$actual" = "$expected" ]; then
            echo "Version Check Successful"
          else
            echo "Version Check Failed"
            docker logs ddp
            exit 1
          fi

      - name: Stop and remove Docker container
        if: always()
        run: |
          docker stop ddp
          docker rm ddp