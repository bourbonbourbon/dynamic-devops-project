repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--settings-path", ".isort.cfg"]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint --fail-under=9
        language: system
        types: [python]
        require_serial: true
        pass_filenames: true
        env:
          PYTHONPATH: src